[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/resolve"
  to = "/.netlify/functions/resolve"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/resolve"
  status = 200
  force = true

# Pages retirées : redirections permanentes (mêmes règles que vercel.json)
[[redirects]]
  from = "/comparateur.html"
  to = "/index.html#categories"
  status = 301

[[redirects]]
  from = "/lexique.html"
  to = "/index.html#categories"
  status = 301

[[redirects]]
  from = "/lexique-pc-portables.html"
  to = "/pc-portables.html#lexique"
  status = 301

# Catégorie smartphones mise de côté (redirection temporaire : elle pourra revenir)
[[redirects]]
  from = "/smartphones.html"
  to = "/index.html#categories"
  status = 302

[[redirects]]
  from = "/smartphones-approfondir.html"
  to = "/index.html#categories"
  status = 302

[[redirects]]
  from = "/capture.html"
  to = "/analyseur.html"
  status = 301

[[redirects]]
  from = "/diagnostic.html"
  to = "/analyseur.html"
  status = 301
